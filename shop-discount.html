<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .created-div {
            margin-top: 15px;
            padding: 15px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            display: inline-block;
        }
    </style>
</head>
<body>
    <button id="make-div">Create Div</button>
    <script>
        // 1. De render-functie die de div maakt én toevoegt
function render(tekst, doelContainer) {
    // Maak het element aan
    const div = document.createElement("div");
    div.className = "created-div";
    div.textContent = tekst;
    
    // Voeg het direct toe aan de gekozen container
    doelContainer.appendChild(div);
}

// 2. Koppel de functie aan de knop
let el = document.querySelector("#make-div");
el.addEventListener("click", () => {
    // Activeer de render-functie met de tekst en de body van de pagina
    render("This div was created by JavaScript", document.body);
});

    </script>
</body>
</html>
